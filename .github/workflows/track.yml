name: jt-tracker

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jt-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run tracker
        env:
          WAYBILL_NO: ${{ vars.WAYBILL_NO }}
          WAYBILL_LABELS: ${{ vars.WAYBILL_LABELS }}
          CALLMEBOT_PHONE: "5512988416345"
          CPF: ${{ secrets.CPF }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PACOTEVICIO_API_KEY: ${{ secrets.PACOTEVICIO_API_KEY }}
          JT_PACOTEVICIO_MIN_INTERVAL_MINUTES: 120
          JADLOG_CTE: ${{ vars.JADLOG_CTE }}
          JADLOG_LABELS: ${{ vars.JADLOG_LABELS }}
        run: python track.py

      - name: Commit state se mudou
        run: |
          git config user.name  "jt-tracker-bot"
          git config user.email "jt-tracker-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git add state/
            git commit -m "chore: atualiza state [skip ci]"
            git push
          else
            echo "sem mudancas no state"
          fi
