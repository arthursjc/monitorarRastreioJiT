name: deploy-cloudflare-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: Enviar mensagem real de teste apos o deploy
        required: false
        type: boolean
        default: false
      run_tracking:
        description: Executar uma rodada completa apos o deploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            CPF
            PACOTEVICIO_API_KEY
            WHATSAPP_PHONE
            GREEN_API_INSTANCE_ID
            GREEN_API_TOKEN
            RUN_TOKEN
        env:
          CPF: ${{ secrets.CPF }}
          PACOTEVICIO_API_KEY: ${{ secrets.PACOTEVICIO_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}

      - name: Verificar endpoint publico
        run: >-
          node -e "fetch('https://jt-monitor.alptecbr.workers.dev/').then(async r => {
          if (!r.ok) throw new Error('health check HTTP ' + r.status);
          console.log(await r.text()); })"

      - name: Testar WhatsApp real
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.test_whatsapp) ||
          contains(github.event.head_commit.message, '[test-whatsapp]')
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: >-
          node -e "fetch('https://jt-monitor.alptecbr.workers.dev/test-whatsapp', {
          method: 'POST', headers: { Authorization: 'Bearer ' + process.env.RUN_TOKEN }
          }).then(async r => { const body = await r.text();
          if (!r.ok) throw new Error('teste WhatsApp HTTP ' + r.status + ': ' + body);
          console.log(body); })"

      - name: Executar rastreamento real
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.run_tracking) ||
          contains(github.event.head_commit.message, '[run-tracker]')
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: >-
          node -e "fetch('https://jt-monitor.alptecbr.workers.dev/run', {
          method: 'POST', headers: { Authorization: 'Bearer ' + process.env.RUN_TOKEN }
          }).then(async r => { const body = await r.text();
          if (!r.ok) throw new Error('rastreamento HTTP ' + r.status + ': ' + body);
          const data = JSON.parse(body); console.log(JSON.stringify(data, null, 2));
          const failures = data.results.filter(x => x.status === 'error');
          if (failures.length) throw new Error(failures.length + ' rastreamento(s) falharam'); })"
