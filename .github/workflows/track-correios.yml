name: correios-tracker

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correios-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run Correios tracker
        env:
          CALLMEBOT_PHONE: "5512988416345"
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CORREIOS_CODES: ${{ vars.CORREIOS_CODES }}
          CORREIOS_LABELS: ${{ vars.CORREIOS_LABELS }}
          PACOTEVICIO_API_KEY: ${{ secrets.PACOTEVICIO_API_KEY }}
          PACOTEVICIO_CONFIDENCE_LEVEL: medium
        run: python track.py

      - name: Commit state se mudou
        run: |
          git config user.name  "jt-tracker-bot"
          git config user.email "jt-tracker-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git add state/
            git commit -m "chore: atualiza state correios [skip ci]"
            git push
          else
            echo "sem mudancas no state"
          fi
